# MEMEKZ Ubuntu Powerline - Termux / Starship

add_newline = false
palette = "memekz_ubuntu"

format = """
$username$hostname[](fg:#77216F bg:#E95420)$directory[](fg:#E95420 bg:#3465A4)$git_branch$git_status[](fg:#3465A4)
$character"""

right_format = ""

[palettes.memekz_ubuntu]
ubuntu_purple = "#77216F"
ubuntu_orange = "#E95420"
ubuntu_blue = "#3465A4"
ubuntu_white = "#FFFFFF"
ubuntu_gray = "#AAAAAA"

[username]
show_always = true
style_user = "bold fg:#FFFFFF bg:#77216F"
style_root = "bold fg:#FFFFFF bg:#77216F"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
ssh_symbol = ""
style = "bold fg:#FFFFFF bg:#77216F"
format = "[@$hostname ]($style)"

[directory]
style = "bold fg:#FFFFFF bg:#E95420"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
read_only_style = "bold fg:#FFFFFF bg:#E95420"

[git_branch]
symbol = " "
style = "bold fg:#FFFFFF bg:#3465A4"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bold fg:#FFFFFF bg:#3465A4"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "​"
up_to_date = ""
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "$"

[character]
success_symbol = "[➜›](bold fg:#3465A4)"
error_symbol = "[➜›](bold fg:#3465A4)"
vimcmd_symbol = "[➜›](bold fg:#3465A4)"
