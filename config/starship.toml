# MEMEKZ@JANDA - Ubuntu Powerline
# Termux / Starship

add_newline = false
palette = "memekz_ubuntu"

format = """
[ MEMEKZ](bold fg:#FFFFFF bg:#77216F)[@JANDA ](bold fg:#FFFFFF bg:#77216F)[](fg:#77216F bg:#E95420)$directory[](fg:#E95420 bg:#3465A4)$git_branch$git_status[](fg:#3465A4)
$character"""

[palettes.memekz_ubuntu]
purple = "#77216F"
orange = "#E95420"
blue = "#3465A4"
white = "#FFFFFF"
green = "#4E9A06"
red = "#CC0000"
yellow = "#C4A000"

[directory]
style = "bold fg:#FFFFFF bg:#E95420"
format = "[  $path ]($style)"
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "bold fg:#FFFFFF bg:#E95420"

[git_branch]
symbol = " "
style = "bold fg:#FFFFFF bg:#3465A4"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bold fg:#FFFFFF bg:#3465A4"
format = "[ $all_status$ahead_behind ]($style)"

[character]
success_symbol = "[➜❯](bold fg:#00BFFF)"
error_symbol = "[➜❯](bold fg:#00BFFF)"
vimcmd_symbol = "[➜❯](bold fg:#00BFFF)"
